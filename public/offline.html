<!doctype html>
<html lang="sw">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0e13">
    <title>Hakuna mtandao · Hadith</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0e13; color: #f8fafc; font: 18px/1.7 system-ui, sans-serif; padding: 24px; }
        main { max-width: 520px; padding: 36px; border: 1px solid #dab56a; border-radius: 20px; background: #121820; }
        .brand { color: #dab56a; letter-spacing: .12em; font-size: 14px; }
        h1 { font-size: 30px; line-height: 1.3; }
        p { color: #cbd5e1; }
        a { display: inline-block; padding: 10px 20px; border-radius: 8px; background: #dab56a; color: #0a0e13; font-weight: 700; text-decoration: none; }
        a:focus-visible { outline: 3px solid white; outline-offset: 5px; }
    </style>
</head>
<body>
    <main>
        <span class="brand">HADITH · MAKTABA YA ELIMU</span>
        <h1>Hakuna muunganisho wa mtandao</h1>
        <p>Unganisha kifaa chako na mtandao ili kusoma hadith, kutafuta au kusikiliza sauti.</p>
        <a href="">Jaribu tena</a>
    </main>
</body>
</html>
